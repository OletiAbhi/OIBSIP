<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALC v1.0</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator">

        <!-- Calculator Header -->
        <header class="calculator-header">
            <div class="brand">
                <span class="terminal-symbol">></span>
                <span>CALC v1.0</span>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                <span>READY</span>
            </div>
        </header>


        <!-- Display -->
        <section class="display">

            <div class="expression" id="expression">
                0
            </div>

            <div class="result" id="result">
                0
            </div>

        </section>


        <!-- Calculation History -->
        <section class="history">

           <div class="history-header">

                <span>HISTORY</span>

                <div class="history-controls">
                    <span id="history-count">0</span>
                    <button id="clear-history" type="button" disabled>CLEAR</button>
                </div>

            </div>

            <div class="history-list" id="history-list">
                <!-- History items will be added using JavaScript -->
            </div>

        </section>


        <!-- Calculator Keypad -->
        <section class="keypad">

            <button class="number" data-value="7">7</button>
            <button class="number" data-value="8">8</button>
            <button class="number" data-value="9">9</button>
            <button class="operator" data-value="/">÷</button>

            <button class="number" data-value="4">4</button>
            <button class="number" data-value="5">5</button>
            <button class="number" data-value="6">6</button>
            <button class="operator" data-value="*">×</button>

            <button class="number" data-value="1">1</button>
            <button class="number" data-value="2">2</button>
            <button class="number" data-value="3">3</button>
            <button class="operator" data-value="-">−</button>

            <button class="number" data-value="0">0</button>
            <button class="decimal" data-value=".">.</button>
            <button class="backspace" id="backspace">⌫</button>
            <button class="operator" data-value="+">+</button>

            <button class="clear" id="clear">C</button>
            <button class="equals" id="equals">=</button>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
