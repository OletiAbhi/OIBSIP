<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | SecureSpace</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-container">

        <section class="login-card register-card">

            <div class="brand">
                <span class="brand-dot"></span>
                <span>SECURESPACE</span>
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Create your secure account to get started.
            </p>

            <form id="register-form">

                <!-- Username -->

                <div class="input-box">

                    <span class="input-icon">👤</span>

                    <input
                        type="text"
                        id="register-username"
                        name="username"
                        placeholder="Username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="input-box">

                    <span class="input-icon">✉</span>

                    <input
                        type="email"
                        id="register-email"
                        name="email"
                        placeholder="Email address"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="input-box">

                    <span class="input-icon">🔒</span>

                    <input
                        type="password"
                        id="register-password"
                        name="password"
                        placeholder="Create password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="register-password-toggle"
                        aria-label="Show password"
                    >
                        ◉
                    </button>

                </div>


                <!-- Confirm Password -->

                <div class="input-box">

                    <span class="input-icon">🔐</span>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="confirm-password-toggle"
                        aria-label="Show password"
                    >
                        ◉
                    </button>

                </div>


                <!-- Password Requirements -->

                <div class="password-requirements">

                    <p>Password requirements</p>

                    <div class="requirement" id="length-requirement">
                        <span>✓</span>
                        <span>At least 8 characters</span>
                    </div>

                    <div class="requirement" id="number-requirement">
                        <span>✓</span>
                        <span>At least 1 number</span>
                    </div>

                </div>


                <p id="register-message" class="form-message"></p>

                <button type="submit" class="auth-button">
                    <span>Create Account</span>
                    <span class="button-arrow">→</span>
                </button>


                <p class="switch-auth">
                    Already have an account?
                    <a href="index.html">Login</a>
                </p>

            </form>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
